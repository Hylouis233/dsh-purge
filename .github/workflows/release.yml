name: Release

on:
  push:
    branches:
      - master
  # 手动发版：可指定版本号（留空则由脚本决定）
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（如 1.1.74；留空自动决定）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Hylouis233/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --check scripts/release-version.mjs
          node --input-type=module -e "import './lib/index.js'"

      # 版本在这里定：
      #   手动指定 > release-notes 里更靠前的新版本 > 当前版本没发过就发它 > 否则 patch+1
      # 「当前版本已发过」= 该发下一版，不是跳过；只有确实推不动时才 skip。
      - name: Resolve version
        id: ver
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs

      - name: Report skip
        if: steps.ver.outputs.skip == '1'
        run: |
          echo "skip: ${{ steps.ver.outputs.reason }}"
          echo "### 未发布：${{ steps.ver.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          zip="dsh-purge-${VERSION}.zip"

          # 发布说明优先取 release-notes.md 里 "# <version>" 段落；
          # 没写就用本次提交标题兜底，保证每次自动发版都有可读说明。
          notes="$(mktemp)"
          if grep -qE "^# +v?${VERSION}\s*$" release-notes.md; then
            awk -v ver="${VERSION}" '
              $0 ~ "^# +v?" ver "[[:space:]]*$" {found=1; next}
              found && /^# +v?[0-9]+\.[0-9]+\.[0-9]+/ {exit}
              found {print}
            ' release-notes.md > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            printf '本版内容\n\n%s\n' "$(git log -1 --pretty=%s)" > "$notes"
          fi

          git archive --format=zip --prefix="dsh-purge-${VERSION}/" --output="$zip" HEAD
          test -s "$zip"

          args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes")
          case "$VERSION" in
            *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
          esac
          gh "${args[@]}"
          gh release upload "$tag" "$zip" --clobber
          echo "published https://github.com/${{ github.repository }}/releases/tag/${tag}"

      # 把新版本写回仓库：插件的更新检查读的是 GitHub tags，
      # 但仓库里的 package.json 若停在旧版，本地与远端就会长期不一致。
      #
      # 注意：跳过标记必须动态拼接，不能把那个字面量写进本文件。
      # GitHub 会扫描整个提交的 diff 来决定是否跳过 workflow，
      # 只要改动里出现该字符串，这次 push 就不会触发 Actions
      # （本仓库踩过：改了 workflow 自己，结果一条 run 都没有）。
      - name: Commit bumped version
        if: steps.ver.outputs.skip != '1' && steps.ver.outputs.bumped == '1'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          skip_mark="[skip"" ci]"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "package.json unchanged; nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): v${VERSION} ${skip_mark}"
          git push origin HEAD:master
