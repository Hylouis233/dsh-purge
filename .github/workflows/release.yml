name: Release

on:
  push:
    branches:
      - master
  # 手动发版：可指定版本号（留空则自动 patch+1）
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号（如 1.1.74；留空自动 patch+1）"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Hylouis233/dsh-purge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax-check plugin entry
        run: |
          node --check lib/index.js
          node --check lib/core.js
          node --check lib/reapply.js
          node --check scripts/release-version.mjs
          node --input-type=module -e "import './lib/index.js'"

      # 版本号在这里定：patch+1 / 采用 release-notes 里更新的段落 / 手动指定。
      # 判定“该版本 tag 已存在”时直接跳过，所以纯文档、纯 CI 改动不会重复发版。
      - name: Resolve version
        id: ver
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-version.mjs

      - name: Skip when this version is already released
        if: steps.ver.outputs.skip == '1'
        run: |
          echo "skip: ${{ steps.ver.outputs.reason }}"
          echo "### 未发布：${{ steps.ver.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: steps.ver.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          zip="dsh-purge-${VERSION}.zip"

          # 日志段落取 release-notes.md 里 "# <version>" 到下一个版本标题之间的内容；
          # 没写就生成一个最小骨架，保证 --notes-file 一定有内容。
          notes="$(mktemp)"
          if grep -qE "^# +v?${VERSION}\s*$" release-notes.md; then
            awk -v ver="${VERSION}" '
              $0 ~ "^# +v?" ver "[[:space:]]*$" {found=1; next}
              found && /^# +v?[0-9]+\.[0-9]+\.[0-9]+/ {exit}
              found {print}
            ' release-notes.md > "$notes"
          fi
          if [ ! -s "$notes" ]; then
            printf '本版内容\n\n%s\n' "$(git log -1 --pretty=%s)" > "$notes"
          fi

          git archive --format=zip --prefix="dsh-purge-${VERSION}/" --output="$zip" HEAD
          test -s "$zip"

          args=(release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes")
          case "$VERSION" in
            *beta*|*alpha*|*rc*) args+=(--prerelease) ;;
          esac
          gh "${args[@]}"
          gh release upload "$tag" "$zip" --clobber
          echo "published https://github.com/${{ github.repository }}/releases/tag/${tag}"
